# Build the static Astro site and deploy it to GitHub Pages.
#
# Pure `astro build` — generated data (derived/, data/indexes/, …) is committed, so CI does NOT run
# `prepare:data`. Project base is /Arthur-Portal (see astro.config.mjs).
#
# ONE-TIME SETUP: Pages must be switched on for the repository before this workflow can
# publish — Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The workflow cannot do this for itself: creating a Pages site requires admin scope, and the
# job's GITHUB_TOKEN tops out at write (we tried `configure-pages` with `enablement: true` and
# it returns "Resource not accessible by integration"). After that single click every push to
# main deploys automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run check:links
      - run: npm run qa:a11y
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
